name: Daily Math

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generation dependencies
        run: |
          pip install --upgrade pip
          pip install "openai==1.43.0" "anthropic>=0.30" "httpx>=0.25,<1" "httpcore>=0.17,<1" markdown2

      - name: Generate candidate quiz
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SITE_TITLE: "Daily Math for Kids"
          PUBLIC_API_BASE: "https://dailymathforkids-api.vercel.app"
        run: python scripts/gen_site.py

      - name: Validate candidate before publication
        run: |
          TODAY=$(python -c 'import sys; sys.path.insert(0, "scripts"); from gen_site import quiz_date_today; print(quiz_date_today())')
          python scripts/validate_quiz.py "$TODAY" --result-file data/validation/today.json

      - name: Run Python and JavaScript conformance twins
        run: |
          mkdir -p data/conformance
          python scripts/run_conformance.py --output data/conformance/python.json
          node scripts/run-conformance.js --output data/conformance/javascript.json
          cmp --silent data/conformance/python.json data/conformance/javascript.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend unit tests
        env:
          JEST_OFFLINE: "1"
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE: ""
        run: |
          npm install --no-audit --no-fund
          npm run test:unit

      - name: Commit and push validated quiz
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add daily index.html sitemap.xml data/latest.json data/validation/today.json
          if ! git diff --cached --quiet; then
            git commit -m "daily: publish validated quiz"
            git push
          else
            echo "No validated quiz changes to commit."
          fi
